name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest

  container:
    name: Build and verify container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build test image
        run: |
          docker build \
            --target test \
            --tag nyc-taxi-data-pipeline:test \
            .

      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            --tag nyc-taxi-data-pipeline:ci \
            .

      - name: Verify runtime CLI
        run: |
          docker run --rm \
            nyc-taxi-data-pipeline:ci \
            --help

      - name: Verify non-root runtime
        run: |
          runtime_uid="$(
            docker run --rm \
              --entrypoint id \
              nyc-taxi-data-pipeline:ci \
              -u
          )"
          test "$runtime_uid" = "10001"
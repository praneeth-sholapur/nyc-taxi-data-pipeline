[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "nyc-taxi-data-pipeline"
version = "0.1.0"
description = "An incremental data pipeline for official NYC TLC trip records."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "httpx[socks]==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.1",
]

[project.scripts]
taxi-pipeline = "taxi_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"